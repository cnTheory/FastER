[project]
name = "faster"
version = "0.2.0"
description = "FastER hackathon patient flow tracker and hospital ranking API"
readme = "README.md"
authors = [
    { name = "colton-perry", email = "colperry42@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
ai = ["google-genai>=1.0"]
databricks = ["databricks-sql-connector>=3.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
faster = "faster:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
