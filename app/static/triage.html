<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FastER · ER recommendation (simulation)</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14181f;--mut:#5b6573;--line:#dde1e7;--acc:#0b6bcb;--bad:#b42318;--ok:#067647;--warn:#b54708;--map:#eaf0f7}
@media(prefers-color-scheme:dark){:root{--bg:#10141a;--card:#181e27;--ink:#eef1f5;--mut:#9aa5b4;--line:#2b3441;--acc:#5aa9ff;--bad:#ff8a80;--ok:#4ade80;--warn:#fdb022;--map:#1d2735}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:920px;margin:0 auto;padding:20px}h1{font-size:1.4rem;margin:0 0 4px}h2{font-size:1.15rem}.mut{color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.row{display:flex;gap:10px;flex-wrap:wrap}textarea,input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
textarea{width:100%;min-height:80px}button{cursor:pointer;background:var(--acc);color:#fff;border:0}button.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}button.on{outline:2px solid var(--acc)}button:disabled{opacity:.6;cursor:wait}
.warn{border-color:var(--bad);color:var(--bad);font-weight:600}.best{border:2px solid var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.grid .card{margin:0}
.hc.rec{border:2px solid var(--ok)}.hc.out{opacity:.55}.hc h3{margin:0 0 4px;font-size:1rem}
.tag{font-size:.72rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);margin-right:4px;display:inline-block}.tag.surge{border-color:var(--bad);color:var(--bad);font-weight:700}.tag.rec{border-color:var(--ok);color:var(--ok);font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;border-radius:99px}
.kv{display:flex;justify-content:space-between;font-size:.88rem}
svg{width:100%;height:auto;display:block;background:var(--map);border-radius:10px}svg text{fill:var(--ink);font:12px system-ui,sans-serif}
</style></head><body><main>
<h1>FastER · where should I go?</h1>
<div class="mut">SIMULATION ONLY. Fictional queues; not medical advice. If it may be life-threatening, call 911.</div>
<div class="card"><b>Scenario</b><div class="row" id="scen" style="margin:8px 0"></div><div class="mut" id="scendesc"></div></div>
<div class="card"><b>Hospital load right now</b> <span class="mut" id="srcline"></span>
<div class="grid" id="cards" style="margin-top:10px"></div></div>
<div class="card"><b>Describe the injury</b>
<textarea id="inj" placeholder="e.g. Rear-ended on the highway, bad neck pain and a deep cut on my arm"></textarea>
<div class="row" style="margin-top:8px"><input id="age" type="number" min="0" max="120" placeholder="Age (optional)" style="width:150px"><button id="go">Find an ER</button></div></div>
<div id="out"></div>
<div class="card"><b>Map</b> <span class="mut">approximate hospital positions, not to scale. Red = surge, green = recommended.</span><div id="map" style="margin-top:8px"></div></div>
</main><script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Approximate coordinates, used only to place markers on the schematic map.
const POS={AMC:[42.652,-73.774],SPH:[42.654,-73.795],SAM:[42.729,-73.679],ELL:[42.812,-73.942],SAR:[43.061,-73.788]};
let status=null,recId=null;
async function api(p,o){const r=await fetch(p,o);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.detail||'Request failed ('+r.status+')');return j}
function load(h){const per=h.active_clinicians?h.patients_waiting/h.active_clinicians:99;return per}
function color(h){if(h.surge)return'var(--bad)';const l=load(h);return l>4?'var(--warn)':'var(--ok)'}
function renderMap(){if(!status)return;const hs=status.hospitals.filter(h=>POS[h.hospital_id]);
const lats=hs.map(h=>POS[h.hospital_id][0]),lngs=hs.map(h=>POS[h.hospital_id][1]);
const minLa=Math.min(...lats),maxLa=Math.max(...lats),minLo=Math.min(...lngs),maxLo=Math.max(...lngs);
const W=640,H=360,pad=60,k=Math.cos(minLa*Math.PI/180);
const sx=(W-2*pad)/Math.max((maxLo-minLo)*k,1e-6),sy=(H-2*pad)/Math.max(maxLa-minLa,1e-6),s=Math.min(sx,sy);
const X=lo=>pad+((lo-minLo)*k)*s+((W-2*pad)-((maxLo-minLo)*k)*s)/2,Y=la=>H-pad-(la-minLa)*s-((H-2*pad)-(maxLa-minLa)*s)/2;
$('map').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Approximate hospital positions">`+hs.map(h=>{const [la,lo]=POS[h.hospital_id];const x=X(lo),y=Y(la),rec=h.hospital_id===recId;
return`<circle cx="${x}" cy="${y}" r="${rec?15:10}" fill="${rec?'var(--ok)':color(h)}" stroke="var(--card)" stroke-width="3"/><text x="${x+18}" y="${y+4}">${esc(h.hospital_id)} · ${esc(h.name)}</text>`}).join('')+`</svg>`}
function renderCards(d){const hs=d.hospitals;const byId=Object.fromEntries((d.scored||[]).map(h=>[h.hospital_id,h]));
$('cards').innerHTML=hs.map(h=>{const sc=byId[h.hospital_id];const rec=h.hospital_id===recId;const out=sc&&!sc.eligible;const pct=Math.min(100,Math.round(load(h)/8*100));
return`<div class="card hc ${rec?'rec':''} ${out?'out':''}"><h3>${esc(h.name)}</h3>
<div>${rec?'<span class="tag rec">RECOMMENDED</span>':''}${h.surge?'<span class="tag surge">SURGE</span>':''}${out?`<span class="tag">${esc(sc.excluded_reason)}</span>`:''}</div>
<div class="bar" title="Waiting patients per clinician"><i style="width:${pct}%;background:${color(h)}"></i></div>
<div class="kv"><span>Waiting</span><b>${esc(h.patients_waiting)}</b></div>
<div class="kv"><span>Clinicians</span><b>${esc(h.active_clinicians)}</b></div>
<div class="kv"><span>Travel</span><b>${esc(h.travel_minutes)} min</b></div>
${sc?`<div class="kv"><span>Est. wait for you</span><b>${esc(sc.estimated_wait_minutes??'—')} min</b></div><div class="kv"><span>Total</span><b>${esc(sc.total_minutes??'—')} min</b></div>`:''}</div>`}).join('')}
async function loadStatus(scored){status=await api('/api/status');
status.hospitals=status.hospitals.map(h=>({...h,patients_waiting:Object.values(h.waiting_by_acuity).reduce((a,b)=>a+b,0)}));
$('srcline').textContent='· queue data: '+status.status_source+' · reference: '+status.reference_source;
status.scored=scored;renderCards(status);renderMap()}
async function loadScen(){const d=await api('/api/scenarios');$('scen').innerHTML=Object.entries(d.scenarios).map(([k,v])=>`<button class="alt ${k===d.current?'on':''}" data-k="${esc(k)}">${esc(v.title)}</button>`).join('');
$('scendesc').textContent=d.scenarios[d.current].description;
$('scen').querySelectorAll('button').forEach(b=>b.onclick=async()=>{await api('/api/scenario/'+b.dataset.k,{method:'POST'});recId=null;$('out').innerHTML='';await loadScen();await loadStatus()});
await loadStatus()}
$('go').onclick=async()=>{const t=$('inj').value.trim();if(t.length<3){$('out').innerHTML='<div class="card warn">Please describe the injury.</div>';return}
$('go').disabled=true;$('out').innerHTML='<div class="card">Working…</div>';
try{const body={injury_description:t};if($('age').value!=='')body.age=Number($('age').value);
const d=await api('/api/recommend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
recId=d.recommended_hospital_id;const rec=d.hospitals.find(h=>h.hospital_id===recId);
$('out').innerHTML=(d.call_911?'<div class="card warn">This may be life-threatening: call 911 now.</div>':'')+
`<div class="card best"><span class="tag">Recommended by ${esc(d.decision_source)}</span><h2 style="margin:6px 0">${esc(d.recommended_name||'No hospital available')}</h2>
<p>${esc(d.summary)}</p>${rec?`<p class="mut">~${esc(rec.travel_minutes)} min travel + ~${esc(rec.estimated_wait_minutes)} min wait (simulated)</p>`:''}
<ol>${(d.next_steps||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
<div class="mut">Urgency level ${esc(d.patient.acuity)} of 5 (source: ${esc(d.patient.triage_source)}) · queue data: ${esc(d.status_source)} · reference data: ${esc(d.reference_source)}</div></div>
<div class="mut">${esc(d.safety_notice)}</div>`;
await loadStatus(d.hospitals)}
catch(e){$('out').innerHTML='<div class="card warn">'+esc(e.message)+'</div>'}finally{$('go').disabled=false}};
loadScen().catch(e=>{$('out').innerHTML='<div class="card warn">'+esc(e.message)+'</div>'});
</script></body></html>
